<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(920px, calc(100vw - 32px));
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      padding: 24px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }
    canvas {
      width: 100%;
      height: 320px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Leaderboard</h1>
    <input id="username" placeholder="username" />
    <button onclick="loadPlayer()">Load</button>
    <canvas id="monGraph" width="900" height="320"></canvas>
  </div>
  <script src="stats.js"></script>
</body>
</html>

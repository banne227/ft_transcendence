<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="stats.css" />
</head>
<body class="m-0 min-h-screen flex items-center justify-center bg-blue-100 font-sans">
  <div class="w-min(920px, calc(100vw - 32px)) bg-white rounded-2xl shadow-2xl p-6">
    <h1 class="m-0 mb-4 text-2xl">Leaderboard</h1>
    <input id="username" placeholder="username" class="mb-4 px-3 py-2 border border-gray-300 rounded" />
    <button onclick="loadPlayer()" class="ml-2 px-4 py-2 bg-blue-500 text-white rounded cursor-pointer hover:bg-blue-600">Load</button>
    <canvas id="monGraph" width="900" height="320" class="w-full h-80 block mt-4"></canvas>
  </div>
  <script src="stats.js"></script>
</body>
</html>

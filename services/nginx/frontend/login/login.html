<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>Connexion — Painter.io</title>
		<link rel="stylesheet" href="login/style.css" />
	</head>

	<body>
		<div class="window">
			<div class="titlebar">
				<span class="titlebar-title">📝 login</span>
				<div class="titlebar-buttons">
					<div class="btn-close">x</div>
				</div>
			</div>

			<div class="window-body">
				<h1>Connexion</h1>

				<form>
					<label>Pseudo</label>
					<input type="text" placeholder="Ton pseudo" />

					<label>Mot de passe</label>
					<input type="password" placeholder="Ton mot de passe" />
					<div class="submit">
						<button type="submit">Se connecter</button>
					</div>
				</form>

				<p>
					Pas de compte ?
					<a href="https://127.0.0.1/register">S'inscrire</a>
				</p>
				<a href="https://127.0.0.1/">Retour</a>
			</div>
		</div>
		<script src="login/script.js"></script>
	</body>
</html>

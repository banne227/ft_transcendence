<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>WEEEEEEEEEEEEEEEEEEEEEE</title>
		<link rel="stylesheet" href="style/hub.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<!--ONGLET (window)-->
		<img id="screamer" src="../images/img_lol.webp" />
		<div class="window" id="window-title">
			<div class="titlebar">
				<span class="titlebar-title">PAINT</span>
				<div class="titlebar-buttons">
					<div class="btn-close">x</div>
				</div>
			</div>
			<div class="window-body">
				<img src="../images/painter.png" alt="logo" />
			</div>
		</div>

		<div class="window" id="window-log">
			<div class="titlebar">
				<span class="titlebar-title">👤 Compte</span>
				<div class="titlebar-buttons">
					<div class="btn-close-log">x</div>
				</div>
			</div>
			<div class="window-body" id="log-body">
				<p class="status-offline">● Non connecté</p>
				<button class="btn-login">Se connecter</button>
			</div>
		</div>

		<!--WINDOW LOGIN-->
		<div class="window" id="window-login">
			<div class="titlebar">
				<span class="titlebar-title">login</span>
				<div class="titlebar-buttons">
					<div class="btn-close">x</div>
				</div>
			</div>

			<div class="window-body">
				<h1>Connexion</h1>

				<form id="form-login">
					<label>Pseudo</label>
					<input
						id="login-username"
						type="text"
						placeholder="Ton pseudo"
					/>

					<label>Email</label>
					<input
						id="login-email"
						type="text"
						placeholder="Ton mail"
					/>

					<label>Mot de passe</label>
					<input
						id="login-password"
						type="password"
						placeholder="Ton mot de passe"
					/>

					<div class="submit">
						<button type="submit">Se connecter</button>
					</div>
				</form>

				<p>
					Pas de compte ? <a href="#" id="btn-inscrire">S'inscrire</a>
				</p>
			</div>
		</div>

		<!--WINDOW REGISTER-->
		<div class="window" id="window-register">
			<div class="titlebar">
				<span class="titlebar-title">register</span>
				<div class="titlebar-buttons">
					<div class="btn-close">x</div>
				</div>
			</div>

			<div class="window-body">
				<h1>Inscription</h1>
				<form id="form-register">
					<label>Pseudo</label>
					<input
						id="register-username"
						type="text"
						placeholder="Choisis un pseudo"
					/>

					<label>Mot de passe</label>
					<input
						id="register-password"
						type="password"
						placeholder="Choisis un mot de passe"
					/>

					<label>Confirmer le mot de passe</label>
					<input
						id="register-password-confirm"
						type="password"
						placeholder="Repete ton mot de passe"
					/>

					<label>Email</label>
					<input
						id="register-email"
						type="email"
						placeholder="Entrez votre adresse mail"
					/>

					<button type="submit">Créer mon compte</button>
				</form>
			</div>
		</div>

		<!--WINDOW CONFIDENTIALITE-->
		<div
			class="window absolute top-20 left-[100px] w-[400px] max-h-96 hidden"
			id="window-privacy"
		>
			<div class="titlebar">
				<span class="titlebar-title">Confidentialité</span>
				<div class="titlebar-buttons">
					<div class="btn-close">x</div>
				</div>
			</div>
			<div
				class="window-body overflow-y-auto max-h-[350px]"
				id="privacy-content"
			>
				Chargement...
			</div>
		</div>

		<div
			class="window absolute top-20 left-[600px] w-[400px] max-h-96 hidden"
			id="window-CGU"
		>
			<div class="titlebar">
				<span class="titlebar-title">Conditions Générales d'Utilisation</span>
				<div class="titlebar-buttons">
					<div class="btn-close">x</div>
				</div>
			</div>
			<div
				class="window-body overflow-y-auto max-h-[350px]"
				id="privacy-CGU"
			>
				Chargement...
			</div>
		</div>

		<!--TASKBAR-->
		<div class="taskbar">
			<button class="task-btn stop" id="compteur">42</button>
			<button class="task-btn">:)</button>
			<button class="task-btn">67</button>
			<button class="task-btn">:(</button>
			<div class="taskbar-right">
				<button class="confi" id="btn-privacy">
					<img src="../images/confi.png" alt="confidentialite" />
				</button>
				<button class="confi" id="CGU">
					<img src="../images/confi2.png" alt="confidentialite" />
				</button>
			</div>
		</div>

		<!--ICON-->

		<div class="play_button">
			<a href="https://transcendence.42.fr/game" title="Play">
				<img src="../images/play_button.png" alt="Play" />
			</a>
		</div>

		<div class="visualizer_button">
			<a href="https://transcendence.42.fr/stats" title="Visualizer">
				<button>Visualizer</button>
			</a>
		</div>

		<!--<div class="fenetre">
    <div class="fenetre_barre">Mon menu</div>
    <div class="fenetre_contenu">
      <p>Contenu de la fenêtre</p>
    </div>
  </div>-->
		<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>

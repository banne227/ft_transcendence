<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Inscription — Painter.io</title>
  <link rel="stylesheet" href="register/style.css">
</head>

<body>
  <div class="window">

    <div class="titlebar">
      <span class="titlebar-title">📝 Inscription</span>
      <div class="titlebar-buttons">
        <div class="btn-close">x</div>
      </div>
    </div>

    <div class="window-body">
      <h1>Inscription</h1>
      <form>
        <label>Pseudo</label>
        <input type="text" placeholder="Choisis un pseudo" />

        <label>Mot de passe</label>
        <input type="password" placeholder="Choisis un mot de passe" />

        <label>Confirmer le mot de passe</label>
        <input type="password" placeholder="Répète ton mot de passe" />

        <button type="submit">Créer mon compte</button>

        <p>Déjà un compte ? <a href="https://127.0.0.1/login">Se connecter</a></p>
        <a href="https://127.0.0.1/page">Retour</a>

      </form>
    </div>
</body>

</html>

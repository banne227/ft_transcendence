events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server {
		listen 443 ssl;
		server_name trancendence.42.fr;

		ssl_certificate /run/secrets/nginx.crt;
		ssl_certificate_key /run/secrets/nginx.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		error_page 404 /404.html;

		root /usr/share/nginx/html;

		location ~* \.(css|js|jpg|jpeg|png|webp|gif|svg|ico|mp3)$ {
			access_log off;
		}

		location = /login {
			try_files /login/login.html =404;
		}

		location = /game {
			try_files /game/game.html =404;
		}

		location = /register {
			try_files /register/register.html =404;
		}

		location = / {
			try_files $uri /hub/page.html =404;
		}

		location / {
			return 404;
		}

		location = /ws/serv {
			proxy_pass http://game:3000;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
		}
	}

	server {
		listen 80;
		server_name trancendence.42.fr;
		return 301 https://$host$request_uri;
	}
}

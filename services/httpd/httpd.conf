# Load required modules
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so

Listen 0.0.0.0:8080
ServerName httpd

# Document root
DocumentRoot /srv/www

# Set loading.html as default
<Directory /srv/www>
    DirectoryIndex loading.html
    Require all granted
</Directory>

# Serve loading page from /loading directory
<Directory /srv/www/loading>
    DirectoryIndex loading.html
    Require all granted
</Directory>

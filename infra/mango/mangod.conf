# Where to store the data.
storage:
  dbPath: "/var/lib/mongo"
  journal:
    enabled: true

# Where to log
systemLog:
  destination: file
  logAppend: true
  path: "/var/log/mongodb/mongod.log"

# network interfaces
net:
  port: 27017
  bindIp: 127.0.0.1
  ssl:
    mode: requireSSL
    PEMKeyFile: /run/secrets/mango.key
security:
  authorization: enabled

services:
    nginx:
        build:
            context: ./infra/nginx
        ports:
            - 0.0.0.0:80:80
            - 0.0.0.0:443:443
        secrets:
            - nginx.crt
            - nginx.key
        restart: 'on-failure:5'
    mangodb:
        build:
            context: ./infra/mango
        secrets:
            - mango.key
        restart: 'on-failure:5'

networks:
    internal:
        driver: bridge

secrets:
    nginx.key:
        file: ./cert/nginx.key
    nginx.crt:
        file: ./cert/nginx.crt
    mango.key:
        file: ./cert/mango.key
    mango.crt:
        file: ./cert/mango.crt

volumes:
    db:
